[package]
name = "may"
version = "0.1.0"
edition = "2024"

[workspace]
members = [
  ".",
  "crates/algorand",
  "crates/diagnostics",
  "crates/parser",
  "crates/semantics",
  "crates/verifier",
]

[dependencies]
algorand = { path = "crates/algorand" }
clap = { version = "4.6.1", features = ["derive"] }
diagnostics = { path = "crates/diagnostics" }
parser = { path = "crates/parser" }
semantics = { path = "crates/semantics" }
verifier = { path = "crates/verifier" }
